[package]
name = "mnesio-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP server and live dashboard for the mnesio agent memory layer."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "mnesio"
path = "src/main.rs"

[features]
default = ["ollama"]
# When enabled, the server can host the real `OllamaLlmClient` for the
# evolution worker. Toggle off (via `--no-default-features`) for CI /
# slim builds that don't need the HTTP dependency tree — the worker
# transparently falls back to `DemoLlmClient`.
ollama = ["mnesio-llm/ollama"]
# Use the real, audited crypto behind the existing seams instead of the offline
# stand-ins: ChaCha20-Poly1305 for the KV crypto-shred keyring (`aead`) and
# ed25519 signatures for the skill-exchange certificate (`ed25519`). Default
# keeps XorCipher / FakeSigner so the dep tree stays light.
aead = ["mnesio-privacy/aead"]
ed25519 = ["mnesio-exchange/ed25519"]
# Surface the real GPU KV-cartridge backend (Qwen2 via candle) in
# `GET /api/kv/metrics`. Heavy dep tree + a ~1GB model download, so it's off by
# default and additionally gated at runtime by `MNESIO_KV_GPU=1`. `metal` adds
# Apple-GPU kernels. The default server build is unaffected.
candle-kv = ["mnesio-kv/candle-kv"]
metal = ["mnesio-kv/metal"]

[dependencies]
mnesio-core.workspace = true
mnesio-code.workspace = true
mnesio-store.workspace = true
mnesio-index.workspace = true
mnesio-graph.workspace = true
mnesio-extract.workspace = true
mnesio-privacy.workspace = true
mnesio-evolve.workspace = true
mnesio-llm = { workspace = true, default-features = false }
mnesio-procedural.workspace = true
mnesio-causal.workspace = true
mnesio-probe.workspace = true
mnesio-kv.workspace = true
mnesio-exchange.workspace = true
mnesio-dream.workspace = true
mnesio-provenance.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
time.workspace = true
