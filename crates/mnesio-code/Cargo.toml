[package]
name = "mnesio-code"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Code memory for mnesio: parses a codebase into symbols + a call graph so agents retrieve only the code they need."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
# The dependency-free core (types, the `CodeParser` seam, the indexer) always
# compiles. Real multi-language parsing pulls in tree-sitter + a grammar per
# language, which is a heavy build, so it stays behind a feature — mirroring
# the `ollama` / `candle-kv` pattern. Tests run against `FakeParser`, so the
# default build and CI stay light and offline.
default = []
# Real grammars. Each language is one line here and one row in
# `parse_ts::GRAMMARS` — adding a language is a table entry, not new parsing
# code, because every grammar ships the same standard `tags.scm` capture names
# (`@definition.function`, `@reference.call`, …) upstream.
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-python", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript", "dep:tree-sitter-go", "dep:tree-sitter-java", "dep:tree-sitter-c", "dep:tree-sitter-cpp", "dep:tree-sitter-c-sharp", "dep:tree-sitter-ruby", "dep:tree-sitter-php", "dep:tree-sitter-swift", "dep:tree-sitter-lua", "dep:tree-sitter-elixir", "dep:tree-sitter-ocaml", "dep:tree-sitter-r", "dep:tree-sitter-dart", "dep:tree-sitter-solidity", "dep:tree-sitter-elm", "dep:tree-sitter-kotlin-ng", "dep:tree-sitter-zig", "dep:tree-sitter-haskell", "dep:tree-sitter-julia", "dep:tree-sitter-objc", "dep:tree-sitter-hcl", "dep:tree-sitter-scala", "dep:tree-sitter-bash"]

[[bin]]
name = "mnesio-code"
path = "src/bin/mnesio-code.rs"
# The CLI needs an async runtime and a real embedder; the library itself does
# not, so these stay out of the default dependency set for library consumers.
required-features = []

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
async-trait.workspace = true
mnesio-core.workspace = true
# `CodeMemory` assembles retrieval, so it needs the index views. Acyclic:
# mnesio-index depends only on mnesio-core.
mnesio-index.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
tree-sitter = { version = "0.25", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-dart = { version = "0.2.0", optional = true }
tree-sitter-elixir = { version = "0.3.5", optional = true }
tree-sitter-elm = { version = "5.9.4", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-haskell = { version = "0.23.1", optional = true }
tree-sitter-hcl = { version = "1.1.0", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-julia = { version = "0.23.1", optional = true }
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true }
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-objc = { version = "3.0.2", optional = true }
tree-sitter-ocaml = { version = "0.25.0", optional = true }
tree-sitter-php = { version = "0.24.2", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-r = { version = "1.3.0", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-scala = { version = "0.26.0", optional = true }
tree-sitter-solidity = { version = "1.2.13", optional = true }
tree-sitter-swift = { version = "0.7.3", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# The comparison only means anything with a grammar to compare against, so it
# is gated rather than failing the default build.
[[example]]
name = "parser_compare"
required-features = ["tree-sitter"]

[[example]]
name = "freshness_bench"
required-features = ["tree-sitter"]
