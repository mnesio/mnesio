[package]
name = "mnesio-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Evaluation harness for mnesio: recall, LLM-judged QA, scale, and adversarial suites."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "mnesio-bench"
path = "src/main.rs"

[dependencies]
mnesio-core.workspace = true
mnesio-store.workspace = true
mnesio-index.workspace = true
mnesio-procedural.workspace = true
mnesio-kv.workspace = true
mnesio-code.workspace = true
mnesio-llm = { workspace = true, default-features = false }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, optional = true }

[features]
default = []
# Enable to swap in the real `OllamaLlmClient` as both the reflector
# LLM and the executor LLM. Off by default — the demo path uses a
# content-derived stub so the benchmark runs offline.
ollama = ["mnesio-llm/ollama"]
# Enable to run `--llm openrouter` / `--executor openrouter` against an
# OpenAI-compatible endpoint (OpenRouter by default). One key reaches Claude +
# GPT — the frontier-class answerer + judge for the published LoCoMo /
# LongMemEval numbers. Key is read from OPENROUTER_API_KEY (env-only).
openai = ["mnesio-llm/openai"]
# Enable to download a real public benchmark (e.g. rajpurkar/squad) from the
# Hugging Face datasets-server into a MemEvalSuite. Pulls in reqwest; off by
# default so the core build + CI stay offline + network-free.
fetch = ["dep:reqwest"]
