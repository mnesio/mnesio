name: release

# Publishes on a version tag (v*): crates.io, PyPI, npm, and a container image
# to GHCR. Where the registry supports it we use tokenless publishing (OIDC /
# trusted publishing / provenance) so no long-lived secrets live in the repo.
#
# ONE-TIME SETUP is required per registry before these jobs succeed — see
# PUBLISHING.md. In particular, crates.io and npm need the *first* publish of a
# name done manually (to establish ownership), after which CI takes over.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----- Prebuilt CLI binaries → the GitHub release -----
  #
  # The reason this job exists: `mnesio-code` is only useful with
  # `--features tree-sitter`, which compiles 28 C grammars. From source that is
  # minutes of build on a first run, against a competitor's `uv tool install`
  # that takes seconds. Nobody evaluates the tool if installing it is the
  # hardest part, so the grammar build happens once, here, and a user downloads
  # the result.
  #
  # `mnesio-mcp` ships alongside because the artifacts and the editor loop are
  # halves of one product: the map shows which symbols helped, and only the MCP
  # server records that.
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # attach assets to the release
    strategy:
      fail-fast: false # one broken platform must not withhold the other four
      matrix:
        include:
          # Both macOS labels are pinned to 15, and both were changed after
          # v0.1.3 shipped with **no Intel Mac binary at all**.
          #
          # The job did not fail. It was *cancelled*, 24 hours after it was
          # queued, with an empty `runner_name` and this annotation:
          #
          #   The job has exceeded the maximum execution time while awaiting
          #   a runner for 24h0m0s
          #
          # `macos-13` had been retired, so the label matched no runner and the
          # job simply waited until GitHub gave up. Nothing in this workflow
          # noticed, because no job depends on `binaries` — see the `verify`
          # job below, which now does.
          #
          # `macos-14` is carrying a deprecation badge as of this change and is
          # on the same path, so it moves now rather than during the release
          # that it breaks. `timeout-minutes` is deliberately *not* the fix
          # here: it bounds execution, not the queue wait that actually
          # elapsed.
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          # 24.04, reluctantly. 22.04 was chosen first so the glibc floor stayed
          # at 2.35 and the binary would start on Debian 12 — the right call in
          # principle, and it produced **no Linux binary at all** for v0.1.1.
          #
          # The prebuilt ONNX Runtime that `fastembed` downloads is compiled
          # against glibc 2.38+, so linking it on 22.04 fails with
          # `undefined symbol: __isoc23_strtoll` (and `__isoc23_strtoull`),
          # which are the glibc 2.38 versions of the C23 conversion functions.
          # No linker flag fixes that; the dependency simply requires a newer
          # libc than the image has.
          #
          # So the floor moves to glibc 2.39 and Debian 12 users lose the
          # prebuilt binary — a real regression in reach, taken because the
          # status quo is that *every* Linux user gets nothing. Going back to a
          # lower floor means building ONNX Runtime from source or shipping a
          # musl build, which is its own task rather than a footnote in this one.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ----- Intel macOS has to build ONNX Runtime itself -----
      #
      # v0.1.4's first rehearsal failed here with:
      #
      #   ort-sys@2.0.0-rc.13: no prebuilt binaries available for target
      #   x86_64-apple-darwin
      #
      # This is not a gap in `ort`. Its `dist.txt` ships ONNX Runtime 1.24.2 for
      # eleven targets — every one we build plus iOS and Android — and Intel
      # macOS is the single omission. Microsoft's own releases agree: across the
      # last ~120 of them there is not one `osx-x86_64` asset, only `osx-arm64`.
      # So there is no prebuilt to download from anywhere, and the only way to
      # ship an Intel Mac binary is to compile the runtime.
      #
      # 1.24.2 is not a guess — it is the exact version in `ort-sys`'s manifest
      # for every other target, and a mismatch would surface as a link error or,
      # worse, an ABI mismatch at runtime. It stays correct only because
      # `Cargo.lock` is now committed and the build below uses `--locked`: before
      # that, CI resolved dependencies fresh and silently moved from ort-sys
      # rc.12 to rc.13 between two builds. If ort-sys is ever bumped, this
      # version must move with it.
      #
      # `ORT_LIB_LOCATION` is checked by ort-sys's build script *before* the
      # download path, so pointing it at a local build needs no feature changes.
      # It points at the build root rather than the `Release` directory so that
      # ort-sys's own profile detection locates the `_deps` tree.
      # restore/save split rather than `actions/cache`, because its save runs
      # as a post step and post steps are skipped when the job fails. The first
      # attempt at this built ONNX Runtime for 63 minutes, failed at the cargo
      # link step afterwards, and threw the whole hour away. The runtime is an
      # expensive artifact that does not depend on our code compiling, so it is
      # saved as soon as it exists.
      - name: Restore the ONNX Runtime build
        if: matrix.target == 'x86_64-apple-darwin'
        id: ort-cache
        uses: actions/cache/restore@v4
        with:
          path: onnxruntime/build/MacOS
          key: ort-1.24.2-${{ matrix.target }}

      - name: Build ONNX Runtime from source (Intel macOS only)
        if: matrix.target == 'x86_64-apple-darwin' && steps.ort-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.24.2 --recursive \
            https://github.com/microsoft/onnxruntime.git onnxruntime
          cd onnxruntime
          # A static build is what ort-sys links: it looks for the per-component
          # `libonnxruntime_*.a` set, which `--build_shared_lib` would replace
          # with a single dylib. Tests are the bulk of the build and prove
          # nothing about our binary, so they are skipped.
          ./build.sh \
            --config Release \
            --parallel \
            --skip_tests \
            --skip_submodule_sync \
            --compile_no_warning_as_error \
            --osx_arch x86_64

      - name: Save the ONNX Runtime build
        if: matrix.target == 'x86_64-apple-darwin' && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: onnxruntime/build/MacOS
          key: ort-1.24.2-${{ matrix.target }}

      # `Release`, not the build root. ort-sys tries its static layouts in
      # order, and the first one expects `_deps` as a *sibling* of the profile
      # directory (`<base>/_deps/onnx-build/Release`). ONNX Runtime's cmake puts
      # it *inside* it (`<base>/Release/_deps/onnx-build`). Pointing at the root
      # matched that first layout on its `libonnxruntime_common.a` probe — which
      # is the only library it checks before committing — so it emitted
      # `-l static=onnx` against a search path that did not exist and never fell
      # through to the layout that fits:
      #
      #   error: could not find native static library `onnx`,
      #   perhaps an -L flag is missing?
      #
      # Naming `Release` directly leaves ort-sys's profile detection empty, so
      # its first layout resolves to `<base>/_deps/onnx-build` and matches what
      # cmake actually produced.
      - name: Point ort-sys at the local ONNX Runtime
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          dir="$PWD/onnxruntime/build/MacOS/Release"
          # Fail here, naming the cause, rather than 60 lines into a link error.
          test -f "$dir/libonnxruntime_common.a" \
            || { echo "::error::no ONNX Runtime static libs in $dir"; ls -la "$dir" || true; exit 1; }
          echo "ORT_LIB_LOCATION=$dir" >> "$GITHUB_ENV"

      - name: Build
        env:
          # ONNX Runtime, pulled in by `fastembed`, is C++. Rust links the C
          # runtime but not `libstdc++`, so on Linux the binary fails at link
          # time with `undefined symbol: std::__cxx11::basic_string<...>`
          # referenced by ort's `logging.cc`. macOS links libc++ implicitly via
          # clang and Windows uses the MSVC runtime, so only the gnu targets
          # need this. v0.1.1 shipped without any Linux asset for exactly this
          # reason.
          RUSTFLAGS: ${{ contains(matrix.target, 'linux') && '-C link-arg=-lstdc++' || '' }}
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p mnesio-code --bin mnesio-code --features tree-sitter
          cargo build --release --locked --target ${{ matrix.target }} \
            -p mnesio-mcp --bin mnesio-mcp
        shell: bash

      # Prove the binary runs on the machine that built it before publishing it.
      # A tarball nobody executed is how a release ships something that cannot
      # start, and `--help` is enough to catch a missing dynamic library.
      - name: Smoke-test what we are about to publish
        run: ./target/${{ matrix.target }}/release/mnesio-code --help
        shell: bash

      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          name="mnesio-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/mnesio-code$ext" "dist/$name/"
          cp "target/${{ matrix.target }}/release/mnesio-mcp$ext" "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$name.zip" "$name" >/dev/null
            asset="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          # Checksums are not decoration: install.sh refuses to install without
          # a matching one, so a truncated download fails loudly instead of
          # leaving a corrupt binary on someone's PATH.
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "asset=dist/$asset" >> "$GITHUB_OUTPUT"

      # Tags only. `workflow_dispatch` exists so the build and the smoke test can
      # be exercised *without* cutting a tag — publishing on dispatch would
      # create a release named after the branch. Being able to prove the matrix
      # builds before tagging is the whole point: v0.1.1 was tagged, and only
      # then did anyone learn that neither Linux target links.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          fail_on_unmatched_files: true

  # ----- Did the release actually get every platform? -----
  #
  # v0.1.3 shipped four of five binaries and nobody found out for three weeks,
  # because every job in this workflow is independent: a cancelled matrix leg
  # withheld its asset and no other job cared. `fail-fast: false` is right — one
  # broken platform must not withhold the other four — but "publish what built"
  # needs a counterpart that says *what did not*.
  #
  # So this asserts the finished release against the matrix, and it runs with
  # `always()` precisely so that a failed or cancelled leg still gets reported
  # rather than silently skipping this check along with itself.
  verify:
    name: every platform shipped
    needs: binaries
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compare published assets against the matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Keep this list in step with the build matrix above.
          targets="
          aarch64-apple-darwin
          x86_64-apple-darwin
          x86_64-unknown-linux-gnu
          aarch64-unknown-linux-gnu
          x86_64-pc-windows-msvc
          "

          have="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                    --json assets --jq '.assets[].name')"
          echo "Published assets:"; echo "$have" | sed 's/^/  /'

          missing=0
          for t in $targets; do
            case "$t" in
              *windows*) asset="mnesio-$TAG-$t.zip" ;;
              *)         asset="mnesio-$TAG-$t.tar.gz" ;;
            esac
            for f in "$asset" "$asset.sha256"; do
              if ! grep -qxF "$f" <<< "$have"; then
                echo "::error title=Missing release asset::$f was never published"
                missing=$((missing + 1))
              fi
            done
          done

          if [ "$missing" -gt 0 ]; then
            echo "$missing expected asset(s) missing from $TAG." >&2
            echo "The release is incomplete — do not announce it as shipped." >&2
            exit 1
          fi
          echo "All five platforms published, with checksums."

  # ----- Container image → GitHub Container Registry (no external secrets) -----
  docker:
    name: container → ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mnesio/mnesio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          # linux/amd64 only: the Rust workspace is heavy and cross-building
          # arm64 under QEMU emulation on the shared runner times out. Add
          # arm64 later via a native arm runner if there's demand.
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----- crates.io (OIDC trusted publishing) -----
  # Requires a Trusted Publisher configured on each mnesio-* crate first, which
  # in turn requires each crate to already exist — so the FIRST publish is
  # manual (see PUBLISHING.md). This job handles every release after that.
  crates-io:
    name: crates.io
    # Gated on a repository variable, because this job *cannot* succeed until a
    # human has done the one-time setup: crates.io Trusted Publishing is
    # configured per crate, and a crate can only be configured once it exists,
    # so the first publish of each `mnesio-*` crate must be done manually with
    # an API token (PUBLISHING.md §2). Until then the job fails with an opaque
    # `Status: 400 — No Trusted Publishing config found`, which marks every
    # release red for a reason that has nothing to do with the release.
    #
    # Set `PUBLISH_CRATES_IO=true` in repo → Settings → Variables once the
    # manual first publish and the trusted publishers are in place. A failure
    # after that is a real failure, which is the point of gating rather than
    # swallowing the error with `continue-on-error`.
    if: vars.PUBLISH_CRATES_IO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exchange OIDC for a short-lived crates.io token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo install cargo-workspaces --locked
      - name: Publish workspace in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # Publishes the versions currently in the manifests, in topological
        # order, skipping any already on crates.io.
        run: cargo ws publish --from-git --allow-dirty --yes --no-git-commit

  # ----- PyPI (OIDC trusted publishing; supports a "pending" publisher) -----
  pypi:
    name: PyPI (mnesio)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel + sdist
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --sdist
          manylinux: auto
          working-directory: crates/mnesio-py
      # Tags only. The *build* above runs on `workflow_dispatch` too, which is
      # the point: the v0.1.1 PyPI failure was a maturin config error that
      # happened before publishing was ever reached, and it could only have
      # been caught by building. Publishing on a dispatch would push a real
      # wheel to PyPI from a branch, which is not a rehearsal.
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: crates/mnesio-py/dist

  # ----- npm (provenance; needs an NPM_TOKEN automation-token secret) -----
  npm:
    name: npm (@mnesio/sdk)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - working-directory: sdk/node
        run: npm ci || npm install
      - working-directory: sdk/node
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
