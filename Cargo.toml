[workspace]
resolver = "2"
members = [
    "crates/mnesio-core",
    "crates/mnesio-store",
    "crates/mnesio-index",
    "crates/mnesio-graph",
    "crates/mnesio-extract",
    "crates/mnesio-privacy",
    "crates/mnesio-llm",
    "crates/mnesio-evolve",
    "crates/mnesio-procedural",
    "crates/mnesio-causal",
    "crates/mnesio-probe",
    "crates/mnesio-kv",
    "crates/mnesio-exchange",
    "crates/mnesio-dream",
    "crates/mnesio-provenance",
    "crates/mnesio-server",
    "crates/mnesio-bench",
    "crates/mnesio-mcp",
    "crates/mnesio-code",
    "crates/mnesio-py",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mnesio/mnesio"
homepage = "https://github.com/mnesio/mnesio"
keywords = ["memory", "agents", "llm", "rag", "ai"]
categories = ["database-implementations", "data-structures"]
rust-version = "1.79"

[workspace.dependencies]
# --- internal crates ---
mnesio-core = { path = "crates/mnesio-core", version = "0.1.0" }
mnesio-store = { path = "crates/mnesio-store", version = "0.1.0" }
mnesio-index = { path = "crates/mnesio-index", version = "0.1.0" }
mnesio-graph = { path = "crates/mnesio-graph", version = "0.1.0" }
mnesio-extract = { path = "crates/mnesio-extract", version = "0.1.0" }
mnesio-privacy = { path = "crates/mnesio-privacy", version = "0.1.0" }
mnesio-llm = { path = "crates/mnesio-llm", version = "0.1.0", default-features = false }
mnesio-evolve = { path = "crates/mnesio-evolve", version = "0.1.0" }
mnesio-procedural = { path = "crates/mnesio-procedural", version = "0.1.0" }
mnesio-causal = { path = "crates/mnesio-causal", version = "0.1.0" }
mnesio-probe = { path = "crates/mnesio-probe", version = "0.1.0" }
mnesio-kv = { path = "crates/mnesio-kv", version = "0.1.0" }
mnesio-exchange = { path = "crates/mnesio-exchange", version = "0.1.0" }
mnesio-dream = { path = "crates/mnesio-dream", version = "0.1.0" }
mnesio-provenance = { path = "crates/mnesio-provenance", version = "0.1.0" }
mnesio-bench = { path = "crates/mnesio-bench", version = "0.1.0" }
mnesio-mcp = { path = "crates/mnesio-mcp", version = "0.1.0" }
mnesio-code = { path = "crates/mnesio-code", version = "0.1.0" }
mnesio-py = { path = "crates/mnesio-py", version = "0.1.0" }

# --- foundation (see architecture report, "Rust Crate Survey") ---
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "macros"] }
async-trait = "0.1"

# --- storage / index (wrapped, per build plan Phase 0) ---
fjall = "2"
tantivy = "0.22"
hnsw_rs = "0.3"
simsimd = "6"
# rustls, not native-tls. fastembed's defaults are
# `ort-download-binaries-native-tls` + `hf-hub-native-tls`, which pull in
# `openssl-sys` and therefore need OpenSSL headers at build time. The manylinux
# container used for the Python wheel has none, so the wheel build died with
# "Package openssl was not found in the pkg-config search path" — after the
# maturin config bug that was hiding it got fixed.
#
# Installing openssl-devel into the container would also work, but rustls
# removes the system dependency instead of satisfying it, which is the better
# answer for a wheel that has to be portable. `image-models` is kept because it
# is in fastembed's default set.
fastembed = { version = "5", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
    "image-models",
] }

# --- viz / server (mnesio-server only) ---
axum = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# --- HTTP client (mnesio-llm 'ollama' feature only) ---
# `rustls-tls` keeps us off OpenSSL / native cert store, which makes the
# crate trivially buildable on every platform CI runs on.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
